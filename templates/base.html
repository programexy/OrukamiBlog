<!DOCTYPE html>
<html lang="en">
<link rel="shortcut icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Orukami Blog{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="logo" href="{{ url_for('home') }}" class="logo-container"><a href="{{ url_for('home') }}"><img src="{{ url_for('static', filename='favicon/favicon.png') }}" alt="Orukami Logo" class="logo-img">
            <span>ORU</span><span>KAMI</span></a></div>
        <nav>
            <a href="{{ url_for('home') }}" class="{% if request.endpoint == 'home' %}active{% endif %}">Home</a>
            <a href="{{ url_for('origami_page') }}" class="{% if request.endpoint == 'origami_page' %}active{% endif %}">Origami</a>
            <a href="{{ url_for('games_page') }}" class="{% if request.endpoint == 'games_page' %}active{% endif %}">Games</a>
            <a href="{{ url_for('about_page') }}" class="{% if request.endpoint == 'about_page' %}active{% endif %}">About Me</a>
        </nav>
    </header>

    {% block content %}{% endblock %}
    <div id="gameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Game Title</h2>
                <button class="close-btn" onclick="closeGameModal()">&times;</button>
            </div>
            <div class="iframe-container">
                <iframe id="gameIframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>
    <footer>
        <p>&copy; 2026 Orukami Blog. Built with Flask & Render.</p>
    </footer>

 <!-- Place this right before </body> -->
<!-- Place this right before </body> -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
